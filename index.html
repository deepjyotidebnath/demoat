<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Attendance</h1>
      <input type="date" id="date" aria-label="Attendance date">
    </header>

    <form id="add-form">
      <input type="text" id="name" placeholder="Student name" required>
      <button type="submit">Add student</button>
    </form>

    <div class="summary">
      <span>Present: <b id="present-count">0</b></span>
      <span>Absent: <b id="absent-count">0</b></span>
      <span>Total: <b id="total-count">0</b></span>
    </div>

    <ul id="list"></ul>

    <div class="actions">
      <button id="all-present" class="ghost">Mark all present</button>
      <button id="reset" class="ghost">Clear day</button>
    </div>
    <p id="empty" class="empty">No students yet. Add a name above to start.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
